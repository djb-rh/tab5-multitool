; Tab5 Multitool firmware, plus the Phase 0 spikes. The library itself is the
; repo root (../src), pulled in with a symlink so edits show up at once.
;
; Same toolchain as the other Tab5 projects: the P4 is only supported by the
; pioarduino fork of platform-espressif32, and the m5stack-tab5-p4 board
; definition installs M5Unified itself (so it is not in lib_deps).

[platformio]
default_envs = app

[common_tab5]
; 55.03.312-1 = Arduino core 3.3.12 / ESP-IDF 5.5.5, the newest stable release
; (checked 2026-11-01; 61.04.00 / IDF 6.1 is still RC).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
lib_deps = https://github.com/M5Stack/M5GFX.git
           https://github.com/m5stack/M5Unified.git
           bblanchon/ArduinoJson@^7.2.0
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Phase 0: report the C6 (esp-hosted) and Tab5 Keyboard firmware, update the
; C6 ('u'), dump the keyboard's raw key events, try the status LEDs.
[env:probe]
extends = common_tab5
build_src_filter = +<probe/>
build_flags = -DCORE_DEBUG_LEVEL=3

; Spike S1: USB keyboard + mouse on USB-C via the full-speed OTG controller.
[env:usbspike]
extends = common_tab5
lib_deps = ${common_tab5.lib_deps}
           symlink://../
build_src_filter = +<usbspike/>

; The Multitool itself.
[env:app]
extends = common_tab5
lib_deps = ${common_tab5.lib_deps}
           symlink://../
           libssh2
           t48
build_src_filter = +<app/>
; The T48 app is T48 for Tab5 (third_party/t48-for-tab5, lib/t48); its Rust
; part (onerom-ffi) is built and linked by this pre-script.
extra_scripts = pre:tools/build_t48.py
; libt5mswift.a is the Embedded Swift side (SwiftTerm); ../swift/build.sh makes it.
app_flags = -I${PROJECT_DIR}/../swift/include
            -I${PROJECT_DIR}/../third_party/libssh2/include
            -L${PROJECT_DIR}/lib/t5mswift -lt5mswift
; Development: 3 s on USB-Serial-JTAG at each boot before USB HID takes USB-C,
; so tools/flash.py can always get in.
build_flags = ${this.app_flags}
              -DT5M_BOOT_JTAG_MS=3000

; What gets released: no wait at boot, and no include/secrets.h (the Wi-Fi
; network is chosen on the Tab5). Flash a Tab5 running it with the Settings
; row "Firmware update mode", or hold BOOT while resetting.
[env:release]
extends = env:app
build_flags = ${env:app.app_flags}
              -DT5M_NO_SECRETS
